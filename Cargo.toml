[package]
name = "kd"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; install.sh checks the same floor before building.
rust-version = "1.85"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3"
terminal_size = "0.4.4"
toml = "1.1.5"
toml_edit = "0.25.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2.2"
ureq = { version = "3", features = ["json"] }
xshell = "0.2"

[dev-dependencies]
