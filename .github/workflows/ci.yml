name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: rustup update stable && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: sudo ln -s /usr/bin/convert /usr/local/bin/magick
      - run: cargo test

  fmt:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo fmt --check

  clippy:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - run: rustup update stable && rustup default stable
      - run: cargo clippy -- -D warnings

  dprint:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting with dprint
        uses: dprint/check@v2.3

  # install.sh is fetched from GitHub and piped straight into bash by users,
  # so a broken revision fails for everyone with no other CI signal; static
  # checks are the only automated guard it gets (no test harness by design).
  shellcheck:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: shellcheck install.sh
